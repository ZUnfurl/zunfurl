# ROADMAP DESIGN EXAMPLE — NO EXPORT / NO IMPORT / NO RESTORE
# This file is intentionally outside .github/workflows and has no trigger.

name: Roadmap Design Example - Backup Plan (No Export)

on: []

permissions:
  contents: read

concurrency:
  group: roadmap-backup-design-disabled
  cancel-in-progress: true

jobs:
  roadmap-plan:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout design source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate roadmap-only recovery boundaries
        run: npm run test:roadmap-recovery

      - name: Generate local Sanity design manifest only
        run: npm run roadmap:backup:sanity:plan -- --json --run-id roadmap-example

      - name: Generate local Shopify design manifest only
        run: npm run roadmap:backup:shopify:plan -- --json --run-id roadmap-example

      - name: State the capability boundary
        run: echo "Roadmap only - no export, no import, no restore, and no remote write."
